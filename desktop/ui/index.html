<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网点歌机</title><link rel="stylesheet" href="style.css"></head><body><header class="title-bar"><img src="../assets/icon.png" alt=""><span>局域网点歌机</span></header><nav class="app-nav" aria-label="软件导航"><button id="nav-home" class="selected">首页与设置</button><button id="nav-song">点歌台</button><button id="nav-admin">管理台</button><button id="login-check" hidden>重新检查登录</button><span id="login-message" hidden role="status"></span><button id="quit">退出软件</button></nav><main><p class="eyebrow">JUKEBOX · 局域网音乐</p><h1>让音乐开始流动</h1><p class="subtitle">电脑播放，同一网络的手机随时点歌。</p><p id="error" role="alert"></p><section id="setup" hidden><h2>首次设置</h2><p>设置管理口令，之后在管理台使用它登录。</p><form><label for="key">管理口令（至少 8 个字符）</label><input id="key" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button>保存并启动</button></form></section><section id="status"><span id="badge">准备中</span><div class="actions"><button id="song">打开点歌台</button><button id="admin" class="secondary">打开管理台</button><button id="resume" class="secondary" hidden>启动主服务</button><button id="restart" class="secondary">重启全部服务</button></div><h2>互联网访问地址</h2><p id="address">等待服务启动</p><button id="copy" class="secondary">复制地址</button></section><section><h2>端口设置</h2><form id="port-form"><label for="main-port">点歌服务端口</label><input id="main-port" type="number" min="1024" max="65535" step="1" required><button id="save-port">保存并重启服务</button></form><p>修改后，手机点歌地址也会更新。</p><p id="api-ports"></p></section><section id="password-section"><h2>修改管理口令</h2><form id="password-form"><label for="old-key">原管理口令</label><input id="old-key" type="password" autocomplete="current-password" required><label for="new-key">新管理口令（8–128 个字符）</label><input id="new-key" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirm-key">再次输入新口令</label><input id="confirm-key" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button id="save-password">修改口令</button></form><p>运行中修改会重启主服务；已停止时保持停止。</p><p id="password-result" role="status"></p></section><section><h2>软件更新</h2><p id="update-version"></p><p id="update-status" role="status"></p><p id="update-notes"></p><div class="actions"><button id="update-check">检查更新</button><button id="update-download" hidden>下载更新，退出后安装</button><button id="update-release" class="secondary">GitHub 版本页面</button></div><p>下载完成后由你自行退出软件，保存数据后安装更新。右上角 × 仅收起到托盘。</p></section><footer><button id="data">用户数据</button><button id="logs">运行日志</button><p>关闭窗口后继续播放；在系统托盘中选择“退出”可停止服务。</p></footer></main><script src="app.js"></script></body></html>
